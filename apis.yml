description: 'QMC Telecom is a provider of shared telecommunications infrastructure for
  mobile networks, operating across Brazil, Mexico, Colombia, Peru, and Chile. The company
  develops, owns, operates, and leases indoor connectivity solutions, street-level
  solutions (SLS), and towers, rooftops, and special sites, positioning itself as a
  partner in 5G network densification. Originally surfaced as a portfolio company of
  Accel and added to the API Evangelist network as a stub, this is a hardware and
  telecommunications-infrastructure company that publishes no public developer or API
  surface.'
